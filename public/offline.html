<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LS Bookers — Hors ligne</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100dvh;
      background: #0a0a0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      overflow: hidden;
    }
    .icon img { width: 100%; height: 100%; object-fit: cover; }
    h1 { font-size: 1.5rem; font-weight: 800; }
    p { color: rgba(255,255,255,0.55); font-size: 0.95rem; line-height: 1.6; max-width: 320px; }
    button {
      margin-top: 0.5rem;
      padding: 0.75rem 2rem;
      background: #7C3AED;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { background: #6d28d9; }
  </style>
</head>
<body>
  <div class="icon">
    <img src="/icons/icon-192.png" alt="LSBookers" />
  </div>
  <h1>Vous êtes hors ligne</h1>
  <p>Vérifiez votre connexion internet et réessayez. Vos données sauvegardées restent accessibles.</p>
  <button onclick="location.reload()">Réessayer</button>
</body>
</html>
